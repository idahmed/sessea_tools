    <meta name="apple-mobile-web-app-title" content="sessea" />
    <meta name="application-name" content="sessea tools" />
    <script>
      // Set the theme before first paint so dark mode users do not see a light flash.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('sessea-tools-theme') } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
